<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figo Registration</title>
</head>
<body>
    <h1 th:text="*{title}"></h1>

    <form th:action="@{/register}" th:object="${user}" method="post">
        <input type = "text" th:field="*{username}" placeholder="Username" required/><br/>
        <input type = "email" th:field="*{email}" placeholder="Email" required/><br/>
        <input type = "password" th:field="*{password}" placeholder="Password" required/><br/>
        <button type="submit">Register</button> 
    </form>
</body> 
</html>
